[package]
name = "accounting-core"
version = "0.4.0"
edition = "2021"
authors = ["Harin <harikri@protonmail.com>"]
description = "Double-entry bookkeeping, financial reporting and reconciliation, with optional Indian GST support"
license = "MIT OR Apache-2.0"
keywords = ["accounting", "bookkeeping", "finance", "gst", "ledger"]
categories = ["finance"]
rust-version = "1.82"
readme = "README.md"
repository = "https://github.com/harisr92/accounting-blue"
# Publish only what builds and documents the library: no CI, editor or data-build files
include = [
    "src/**/*",
    "examples/**/*",
    "tests/**/*",
    "Cargo.toml",
    "README.md",
    "CHANGELOG.md",
    "LICENSE*",
]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
# GSTR-1 JSON export and the HSN/SAC master, behind the `india` feature
serde_json = { version = "1.0", optional = true }
# PDF export, behind the `pdf` feature (needs Rust 1.88)
printpdf = { version = "0.12", default-features = false, features = ["png", "jpeg"], optional = true }
# UPI QR codes on the PDF, behind the `pdf` feature
qrcode = { version = "0.14", default-features = false, optional = true }

[dev-dependencies]
serde_json = "1.0"
# Decodes the UPI QR code in the PDF tests
rqrr = "0.9"
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Indian GST: rates and maths, GSTIN, HSN/SAC master, GST invoices and credit notes, GSTR-1
india = ["dep:serde_json"]
# Render GST invoices to PDF with printpdf (implies `india`)
pdf = ["india", "dep:printpdf", "dep:qrcode"]

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"

[[example]]
name = "basic_ledger"
path = "examples/basic_ledger.rs"

[[example]]
name = "gst_calculations"
path = "examples/gst_calculations.rs"
required-features = ["india"]

[[example]]
name = "gst_invoice"
path = "examples/gst_invoice.rs"
required-features = ["india"]

[[example]]
name = "gstr1_export"
path = "examples/gstr1_export.rs"
required-features = ["india"]

[[example]]
name = "invoice"
path = "examples/invoice.rs"

[[example]]
name = "reconciliation"
path = "examples/reconciliation.rs"

[[example]]
name = "gst_invoice_pdf"
path = "examples/gst_invoice_pdf.rs"
required-features = ["pdf"]
