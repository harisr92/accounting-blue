[package]
name = "accounting-core"
version = "0.2.0"
edition = "2021"
authors = ["Harin <harikri@protonmail.com>"]
description = "Core accounting functionality with double-entry bookkeeping, GST calculations, and financial reporting"
license = "MIT OR Apache-2.0"
keywords = ["accounting", "bookkeeping", "finance", "gst", "ledger"]
categories = ["finance"]
rust-version = "1.82"
readme = "README.md"
repository = "https://github.com/harisr92/accounting-blue"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
async-trait = "0.1"
serde_json = "1.0"
# PDF export, behind the `pdf` feature (needs Rust 1.88)
printpdf = { version = "0.12", default-features = false, optional = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }

[features]
default = []
# Render GST invoices to PDF with printpdf
pdf = ["dep:printpdf"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
uninlined_format_args = "warn"
redundant_closure_for_method_calls = "warn"
explicit_iter_loop = "warn"

[[example]]
name = "basic_ledger"
path = "examples/basic_ledger.rs"

[[example]]
name = "gst_calculations"
path = "examples/gst_calculations.rs"

[[example]]
name = "gst_invoice"
path = "examples/gst_invoice.rs"

[[example]]
name = "reconciliation"
path = "examples/reconciliation.rs"

[[example]]
name = "gst_invoice_pdf"
path = "examples/gst_invoice_pdf.rs"
required-features = ["pdf"]
